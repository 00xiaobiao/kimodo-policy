name: doubledesk_twist2_test
description: Test-only TWIST2 eval config for Isaac-Move-PickPlace-DoubleDesk-G129-Dex3-Wholebody.
task_name: Isaac-Move-PickPlace-DoubleDesk-G129-Dex3-Wholebody
backend: twist2

test_defaults:
  seeds: [0, 1, 2]
  repeats_per_seed: 20
  persistent_sim: true
  episode_seed_formula: sha256(task_name|group_seed|repeat_idx)_positive_int32

overrides:
  wait_for_textures: false
  sim:
    dt: 0.001
  decimation: 20
  object_reset_seed_source: env_seed
  deterministic_object_resets:
    - record_name: hammer
      scene_keys: [object_l, ObjectL]
      pose_range:
        x: [-3.2, -2.4]
        y: [-3.15, -3.0]
        z: [0.8, 0.8]
        yaw: [-0.35, 0.35]
      zero_velocity_on_reset: true
    - record_name: basket
      prim_paths: ["/World/envs/env_{env_idx}/Basket"]
      pose_range:
        x: [-3.6, -2.0]
        y: [-0.3, -0.005]
        z: [0.745, 0.745]
        yaw: [-0.785398, 0.785398]
      zero_velocity_on_reset: true
