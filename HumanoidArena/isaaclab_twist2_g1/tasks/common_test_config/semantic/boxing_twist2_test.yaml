name: boxing_twist2_test
description: Test-only TWIST2 eval config for Isaac-Move-Boxing-Bag-G129-Dex3-Wholebody.
task_name: Isaac-Move-Boxing-Bag-G129-Dex3-Wholebody
backend: twist2

test_defaults:
  seeds: [0, 1, 2]
  repeats_per_seed: 20
  persistent_sim: true
  episode_seed_formula: sha256(task_name|group_seed|repeat_idx)_positive_int32

overrides:
  scene.boxing_target.spawn.usd_path: "${PROJECT_ROOT}/assets/objects/small_warehouse/small_warehouse_boxing/interaction_obj/boxing_target_semantic_small.usd"
  wait_for_textures: false
  sim:
    dt: 0.001
  decimation: 20
  object_reset_seed_source: env_seed
  boxing_target_randomization:
    enabled: true
    record_name: boxing_target
    cylinder_selection: uniform
    cylinders:
      - name: bag_1
        center: [-0.97, -3.7, 0.8]
        radius: 0.15
        height_range: [0.75, 0.85]
        azimuth_range: [-3.141592653589793, 3.141592653589793]
        yaw_range: [0.0, 0.0]
      - name: bag_2
        center: [-3.0, -3.7, 0.8]
        radius: 0.15
        height_range: [0.75, 0.85]
        azimuth_range: [-3.141592653589793, 3.141592653589793]
        yaw_range: [0.0, 0.0]
    # Legacy single-cylinder fields kept for compatibility with older code/config.
    center: [-0.97, -3.7, 0.8]
    radius: 0.15
    height_range: [0.75, 0.85]
    azimuth_range: [-3.141592653589793, 3.141592653589793]
    yaw_range: [0.0, 0.0]
