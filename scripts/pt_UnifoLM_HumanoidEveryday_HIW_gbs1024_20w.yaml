main:
  batch_size: 128
  max_steps: 200000
  save_steps: 50000
  action_chunk: 50
  action_history: 100
  sample_stride: 1
  seed: 42
  save_root: "log/pt_UnifoLM_HumanoidEveryday_HIW_gbs1024_20w/"
  dtype: "bf16"

  dataset_roots:
    UnifoLM_WBT_Dataset: "${oc.env:UNIFOLM_ROOT,/data/local-data/data/Humanoid/UnifoLM_WBT_Dataset}"
    HumanoidEveryday: "${oc.env:HUMANOID_EVERYDAY_ROOT,/data/local-data/data/Humanoid/HumanoidEveryday}"
    HIW500: "${oc.env:HIW500_ROOT,/data/local-data/data/Humanoid/HIW500-LeRobot}"

  dataset_selection:
    UnifoLM_WBT_Dataset:
      tasks: ["*"]
      camera: "observation.images.head_stereo_left"
      joint_jump_threshold_radians: 0.5
      root_rotation_jump_threshold_degrees: 30.0
    HumanoidEveryday:
      tasks: ["*"]
      joint_jump_threshold_radians: 0.5
      root_rotation_jump_threshold_degrees: 30.0
    HIW500:
      tasks: ["*"]
      camera: "observation.images.head"
      stereo_view: "left"
      hand_trigger_threshold: 5.0
      hand_squeeze_threshold: 0.5
      joint_jump_threshold_radians: 0.5

  sampling:
    mode: "window_proportional"
    windows_per_episode: 4

  episode_cache_size: 16
  cpu_workers_num: 12
  precompute_text_embeddings: true
  wandb: "offline"
  wandb_project: "Kimodo-Policy"
  wandb_run_name: "pt_UnifoLM_HumanoidEveryday_HIW_gbs1024_20w"
  gradient:
    grad_clip_norm: 0.5
    hand_grad_clip_norm: 1.0
    grad_accumulation_steps: 1

model:
  fps: 30
  motion_mask_mode: "concat"
  dinov3_model_name: "dinov3-vitl16-pretrain-lvd1689m"
  dinov3_checkpoint: null
  text_feature_dim: 4096
  controlnet_num_layers: 16
  enable_hand_head: true
  hand_hidden_dim: 256
  hand_num_layers: 4
  hand_num_heads: 4
  hand_ffn_dim: 1024
  hand_init_seed: 3407
  compile: true
  compile_mode: "reduce-overhead"

training:
  loss:
    root_weight: 2.0
    body_weight: 1.0
    hand_weight: 1.0
    hand_transition_weight: 0.2
  optimizer:
    control_backbone_lr: 3.0e-5
    control_adapter_lr: 1.0e-4
    hand_lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
    fused: true
  scheduler:
    warmup_ratio: 0.01
    num_cycles: 0.5
    min_lr_ratio: 0.1
