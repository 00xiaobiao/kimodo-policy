main:
  batch_size: 16
  max_steps: 100000
  save_steps: 50000
  action_chunk: 50
  action_history: 100
  sample_stride: 1
  seed: 42
  save_root: "log/only_HumanoidArena_sonic_8_refpose_v3_1/"
  dtype: "bf16"

  dataset_roots:
    HumanoidArena: "${oc.env:HUMANOID_ARENA_ROOT,/data/local-data/data/Humanoid/HumanoidArena_dataset_v3_1}"

  dataset_selection:
    HumanoidArena:
      merged: "sonic_8_refpose_v3_1"

  sampling:
    mode: "episode_uniform"

  # The legacy merged name contains 8 tasks; the loader excludes HOI_grap_cup,
  # leaving 7 tasks and 700 episodes for training.
  episode_cache_size: 700  # cache all usable episodes per worker; 2 TiB host RAM is sufficient
  cpu_workers_num: 32      # 4 ranks x 32 workers = 128, matched to this 192-core server
  precompute_text_embeddings: true
  wandb: "offline"
  wandb_project: "Kimodo-Policy"
  wandb_run_name: "only_HumanoidArena_sonic_8_refpose_v3_1"
  gradient:
    grad_clip_norm: 0.5
    hand_grad_clip_norm: 1.0
    grad_accumulation_steps: 1

model:
  fps: 30
  motion_mask_mode: "concat"
  dinov3_model_name: "dinov3-vitl16-pretrain-lvd1689m"
  dinov3_checkpoint: null
  text_feature_dim: 4096
  controlnet_num_layers: 16
  enable_hand_head: true
  hand_hidden_dim: 256
  hand_num_layers: 4
  hand_num_heads: 4
  hand_ffn_dim: 1024
  hand_init_seed: 3407
  compile: true
  compile_mode: "reduce-overhead"

training:
  loss:
    root_weight: 2.0
    body_weight: 1.0
    hand_weight: 1.0
    hand_transition_weight: 0.2
  optimizer:
    control_backbone_lr: 3.0e-5
    control_adapter_lr: 1.0e-4
    hand_lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
    fused: true
  scheduler:
    warmup_ratio: 0.01
    num_cycles: 0.5
    min_lr_ratio: 0.1
