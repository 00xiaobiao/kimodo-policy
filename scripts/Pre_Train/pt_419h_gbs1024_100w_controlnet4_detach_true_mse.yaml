main:
  batch_size: 128
  max_steps: 1000000
  save_steps: 200000
  action_chunk: 50
  action_history: 100
  sample_stride: 1
  seed: 42
  # Fraction of the discovered pre-training episodes to use. Missing means 1.0.
  pretrain_data_fraction: 1.0
  save_root: "${oc.env:KIMODO_PT_SAVE_ROOT,log/Pre_Train/pt_419h_gbs1024_100w_controlnet4_detach_true_mse/}"
  dtype: "bf16"

  dataset_roots:
    UnifoLM_WBT_Dataset: "${oc.env:UNIFOLM_ROOT,datasets/UnifoLM_WBT_Dataset}"
    HumanoidEveryday: "${oc.env:HUMANOID_EVERYDAY_ROOT,datasets/HumanoidEveryday}"
    HIW500: "${oc.env:HIW500_ROOT,datasets/HIW500}"

  dataset_selection:
    UnifoLM_WBT_Dataset:
      tasks: ["*"]
      camera: "observation.images.head_stereo_left"
      joint_jump_threshold_radians: 0.5
      root_rotation_jump_threshold_degrees: 30.0
    HumanoidEveryday:
      tasks: ["*"]
      joint_jump_threshold_radians: 0.5
      root_rotation_jump_threshold_degrees: 30.0
    HIW500:
      tasks: ["*"]
      camera: "observation.images.head"
      stereo_view: "left"
      hand_trigger_threshold: 5.0
      hand_squeeze_threshold: 0.5
      joint_jump_threshold_radians: 0.5

  sampling:
    mode: "window_proportional"
    windows_per_episode: 8

  episode_cache_size: 16
  cpu_workers_num: 24
  precompute_text_embeddings: true
  precompute_motion_cache: true
  wandb: "offline"
  wandb_project: "Kimodo-Policy"
  wandb_run_name: "${oc.env:KIMODO_PT_RUN_NAME,pt_419h_gbs1024_100w_controlnet4_detach_true_mse}"
  gradient:
    grad_clip_norm: 1.0
    hand_grad_clip_norm: 1.0
    grad_accumulation_steps: 1

model:
  fps: 30
  motion_mask_mode: "concat"
  dinov3_model_name: "dinov3-vitl16-pretrain-lvd1689m"
  dinov3_checkpoint: null
  text_feature_dim: 4096
  controlnet_num_layers: 4
  detach_root_control_for_body: true
  control_fusion_mode: "both"
  hand_hidden_dim: 256
  hand_num_layers: 4
  hand_num_heads: 4
  hand_ffn_dim: 1024
  hand_init_seed: 3407
  compile: true
  compile_mode: "reduce-overhead"

training:
  loss:
    motion_loss_type: mse
    kimodo_smooth_l1_weights:
      root_position: 10.0
      root_heading: 2.0
      joint_position: 10.0
      joint_velocity: 3.0
      joint_rotation: 10.0
      foot_contact: 4.0
      fk: 5.0
    mse_weights:
      root: 4.0
      body: 1.0
      hand: 1.0
      hand_transition: 0.2
  optimizer:
    control_backbone_lr: 3.0e-5
    control_adapter_lr: 1.0e-4
    hand_lr: 1.0e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1.0e-8
    fused: true
  scheduler:
    warmup_ratio: 0.01
    num_cycles: 0.5
    min_lr_ratio: 0.1
